name: Gerar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3
      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Baixar Gradle 8.9 e compilar APK debug instalável
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dieta-15-Dias-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
